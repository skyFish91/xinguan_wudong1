# 乌东文旅"衣食住行"综合服务平台 一键编排
# 使用：cd deploy && docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: wudong-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化自动按文件名顺序执行：01-ddl.sql（建库建表）→ 02-dml.sql（种子数据）
      - ../sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wudong-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  server:
    build: ../server
    container_name: wudong-server
    environment:
      NODE_ENV: production
      SERVER_PORT: 7001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAME: wudong
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-wudong-jwt-secret-2026}
      APP_KEYS: ${APP_KEYS:-wudong-secret-key-2026}
      TZ: Asia/Shanghai
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "${SERVER_PORT:-7001}:7001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ../web
    container_name: wudong-web
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      - server
    restart: unless-stopped

  admin:
    build: ../admin
    container_name: wudong-admin
    ports:
      - "${ADMIN_PORT:-8082}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  uploads-data:
