# 乌东文旅平台 CI 流水线：后端 lint/build/test（真实 MySQL 服务容器）+ 前端构建 + Docker 镜像构建验证
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server-ci:
    name: 后端 校验/构建/测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL 已就绪"
              exit 0
            fi
            sleep 5
          done
          echo "MySQL 未在预期时间内就绪"
          exit 1
      - name: 初始化测试库 wudong_test
        run: node scripts/prepare-test-db.js
      # 静态检查（ESLint）暂未启用：eslint 依赖未安装，直接执行 npm run lint 会失败；
      # 后续如需启用，先 npm i -D eslint 并补充规则配置，再恢复下面两步
      # - name: ESLint
      #   run: npm run lint
      - name: 编译构建
        run: npm run build
      - name: 单元测试（真实 MySQL，覆盖率门槛 60%）
        run: npm test

  web-ci:
    name: PC 端 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查并构建
        run: npm run build

  admin-ci:
    name: 管理后台 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查并构建
        run: npm run build

  docker-build:
    name: Docker 镜像构建验证
    runs-on: ubuntu-latest
    needs: [server-ci, web-ci, admin-ci]
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        working-directory: server
        run: docker build -t wudong-server:ci .
      - name: 构建 PC 端镜像
        working-directory: web
        run: docker build -t wudong-web:ci .
      - name: 构建管理后台镜像
        working-directory: admin
        run: docker build -t wudong-admin:ci .
